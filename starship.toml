# oh-my-starship: an opinionated, powerline-style Starship prompt.
#
# The git segment is rendered by one helper script (one rev-parse + one status
# per prompt), located via the $OMS_DIR environment variable that the installer
# adds to your shell rc. If $OMS_DIR is unset or the script is missing, the
# prompt degrades gracefully to the plain directory segment.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$directory\
${custom.git}\
"""

add_newline = false
command_timeout = 5000

[directory]
style = 'fg:black bg:blue'
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false

[git_branch]
disabled = true

[git_status]
disabled = true

[custom.git]
command = '"$OMS_DIR/git-prompt.sh" 2>/dev/null || printf "\033[34m\356\202\260\033[0m"'
when = true
format = "$output "
shell = ["sh"]

[character]
success_symbol = ''
error_symbol = '[✘](red) '

[username]
style_user = 'fg:white bg:black'
style_root = 'fg:yellow bg:black'
format = "[ $user@ ]($style)[](fg:black bg:blue)"

[hostname]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[terraform]
disabled = true

[docker_context]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[kotlin]
disabled = true

[swift]
disabled = true

[ruby]
disabled = true

[package]
disabled = true

[cmake]
disabled = true

[cmd_duration]
disabled = true
